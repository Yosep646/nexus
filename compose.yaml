services:
  api:
    build: .
    restart: unless-stopped
    environment:
      NEXUS_API_KEY: ${NEXUS_API_KEY:?Set a random key of at least 24 characters}
      NEXUS_DB_PATH: /app/data/nexus.db
      NEXUS_CORS_ORIGINS: http://127.0.0.1:5500,http://localhost:5500
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - nexus_data:/app/data
      - ./models/teachable_machine:/app/models/teachable_machine:ro
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  nexus_data:
