name: Build Windows IP Camera Bridge
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/nexus_ip_bridge_windows.py'
      - '.github/workflows/windows-ip-bridge.yml'
permissions:
  contents: read
jobs:
  windows-bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.16.0 opencv-python-headless==4.10.0.84
      - name: Verify OpenCV and bridge source
        run: |
          python -m py_compile scripts/nexus_ip_bridge_windows.py
          python -c "import cv2; print('OpenCV', cv2.__version__)"
      - name: Build Windows executable
        run: python -m PyInstaller --clean --onefile --console --name NEXUS-Camara-IP scripts/nexus_ip_bridge_windows.py
      - name: Smoke-test Windows executable
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/NEXUS-Camara-IP.exe')) { throw 'EXE not generated' }
          if ((Get-Item 'dist/NEXUS-Camara-IP.exe').Length -lt 1000000) { throw 'EXE unexpectedly small' }
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Camara-IP-Windows
          path: dist/NEXUS-Camara-IP.exe
          retention-days: 30
