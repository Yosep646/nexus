name: Build Windows IP Camera Bridge
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/nexus_ip_bridge_windows.py'
      - '.github/workflows/windows-ip-bridge.yml'
permissions:
  contents: read
jobs:
  windows-bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.16.0
      - name: Build Windows executable
        run: python -m PyInstaller --clean --onefile --console --name NEXUS-Camara-IP scripts/nexus_ip_bridge_windows.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Camara-IP-Windows
          path: dist/NEXUS-Camara-IP.exe
          retention-days: 30
