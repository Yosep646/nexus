name: Backend tests
on:
  workflow_dispatch:
  push:
    branches: [main, feature/detection-mvp, integration/backend-ci-safe]
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'Dockerfile*'
      - 'compose*.yaml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'Dockerfile*'
      - 'compose*.yaml'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Compile all backend and training Python sources
        run: python -m compileall -q backend training
      - name: Validate Docker Compose configuration
        env:
          NEXUS_API_KEY: ci-validation-key-12345678901234567890
        run: docker compose -f compose.yaml -f compose.ml.yaml config --quiet
      - name: Build backend Docker image
        run: docker build -t nexus-ci:${{ github.sha }} -f Dockerfile .
      - name: Smoke test running Docker API and authentication
        run: |
          docker run -d --name nexus-api-smoke -e NEXUS_API_KEY=ci-validation-key-12345678901234567890 -e NEXUS_DB_PATH=/tmp/nexus-smoke.db nexus-ci:${{ github.sha }}
          trap 'docker rm -f nexus-api-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 15); do
            if docker exec nexus-api-smoke python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200" 2>/dev/null; then break; fi
            sleep 2
          done
          docker exec nexus-api-smoke python -c "import urllib.request, urllib.error; base='http://127.0.0.1:8000'; assert urllib.request.urlopen(base+'/health').status==200; request=urllib.request.Request(base+'/api/cameras',headers={'X-API-Key':'ci-validation-key-12345678901234567890'}); assert urllib.request.urlopen(request).status==200; print('Docker health and authenticated API: OK')"

      - name: Verify Railway-assigned custom port inside container
        run: |
          docker run -d --name nexus-railway-port -e PORT=9876 -e NEXUS_API_KEY=ci-validation-key-12345678901234567890 -e NEXUS_DB_PATH=/tmp/nexus-port.db nexus-ci:${{ github.sha }}
          trap 'docker rm -f nexus-railway-port >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 15); do
            if docker exec nexus-railway-port python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:9876/health', timeout=3).status==200" 2>/dev/null; then echo 'Railway PORT=9876: OK'; exit 0; fi
            sleep 2
          done
          docker logs nexus-railway-port
          exit 1
